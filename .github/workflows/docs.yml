name: Documentation and impact
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tauapi-be/go.mod
          cache-dependency-path: tauapi-be/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Resolve exact baseline and candidate
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          CANDIDATE: ${{ github.sha }}
        run: |
          candidate=$(git rev-parse "$CANDIDATE^{commit}")
          baseline="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then baseline=$(git rev-parse "$candidate^"); fi
          git rev-parse --verify "$baseline^{commit}"
          echo "DOCS_BASE=$baseline" >> "$GITHUB_ENV"
          echo "DOCS_HEAD=$candidate" >> "$GITHUB_ENV"
      - name: Prepare tools
        run: make docs-setup
      - name: Structural checks and rejection tests
        run: make docs-check docs-test
      - name: Candidate impact and actual selected checks
        run: |
          make --silent docs-impact DOCS_BASE="$DOCS_BASE" DOCS_HEAD="$DOCS_HEAD" > /tmp/docs-impact.json
          if .docs-venv/bin/python -c 'import json,sys; sys.exit(not json.load(open("/tmp/docs-impact.json"))["technical_paths"])'; then
            (cd tauapi-fe && bun install --frozen-lockfile)
          fi
          .docs-venv/bin/python docs/tools/docsctl.py run-checks --base "$DOCS_BASE" --head "$DOCS_HEAD" --record auto --evidence-dir .docs-reports
      - name: Publish candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-evidence-${{ github.sha }}-${{ github.run_id }}
          path: .docs-reports/
          if-no-files-found: error
          retention-days: 90
  docs-required:
    if: always()
    needs: [candidate]
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required outcome
        env:
          RESULT: ${{ needs.candidate.result }}
        run: test "$RESULT" = success
