    {
      "id": "OBL-0180",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 3,
      "original_sha256": "ee59d25b09754cf45a520b79c895b09ac5e702ff114034b0f4889cf2507c0502",
      "requirement": "**One expression, one truth.** A single expression string completely defines a model's billing logic — pricing, tier conditions, cache/image/audio differentiation, time-based discounts, request-aware multipliers — all in one line. No scattered configuration, no implicit rules, no magic numbers.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0181",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 4,
      "original_sha256": "6dc24ffb7b248dc18a31e004f0019d74d303090e98bd16aff7da2a16bfb25c82",
      "requirement": "The expression is the billing contract between the administrator and the system. What you write is what gets executed. The system's job is to evaluate it faithfully, not to interpret it.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0182",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 5,
      "original_sha256": "dc333b00710d81f27914d19bde6042d7af74df84500ba12e989ab3d446cd4e1f",
      "requirement": "### Core Principles",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0183",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 6,
      "original_sha256": "be171eb9f879c3c117c2be1c839c2234700d2c563a22eac1f5ece9d5ced97299",
      "requirement": "1. **Expression is self-contained** — The expression string alone determines billing. No external ratio tables, no implicit completion multipliers, no hidden conversion factors. Given the same token counts and request context, the same expression always produces the same cost.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0184",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 7,
      "original_sha256": "1c2e80873d4b335d11702b69ff553e9145620012704242a2afdfffdfbdd5af21",
      "requirement": "2. **Variables are opt-in** — `p` (prompt) and `c` (completion) are the base. Cache (`cr`, `cc`, `cc1h`, `cc12h`), image (`img`), and audio (`ai`, `ao`) variables are optional. If omitted, those tokens are included in `p`/`c` and priced at their rate; an omitted long-lived cache write keeps its fixed multiple of the short write price. The system automatically detects which variables the expression uses (via AST introspection) and adjusts token normalization accordingly.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0185",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 8,
      "original_sha256": "f0cea22a5d856b4029bd516779a52f4c7853389d1d5577b0292801047f0f3bbf",
      "requirement": "3. **Prices are real prices** — Token coefficients are actual $/1M tokens prices as published by providers. `p * 2.5` means $2.50 per 1M prompt tokens; `fixed(0.01)` means $0.01 per request. No ratio conversion or `/2` convention is required.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0186",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 9,
      "original_sha256": "2cd07c7be24db0fc2f6625fd3f078d5cc410b01ad4509ee3efd94f782d926705",
      "requirement": "4. **Upstream-agnostic** — The expression doesn't need to know whether the upstream API is OpenAI-format (prompt_tokens includes cache) or Claude-format (input_tokens excludes cache). The system normalizes token counts before evaluation based on the upstream response format.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0187",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 10,
      "original_sha256": "4438a3127c8e605e8585ea43531e7006d9cd0b22a0a175d23fd28f92fcfcd6f5",
      "requirement": "5. **Version-aware** — Expressions carry a version tag (`v1:`, default when omitted). The version controls the compile environment, token normalization, and quota conversion formula, enabling future evolution without breaking existing expressions.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
