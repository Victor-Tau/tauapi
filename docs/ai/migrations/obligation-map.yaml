      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0242",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 65,
      "original_sha256": "aaea2aab25bb8be8d6552f655db99c257387c015d94425b751b6395a942f6834",
      "requirement": "The usage-log UI treats `request_rules` as the authoritative rule list and renders directly from it. It parses `cond` only to produce a friendly label and falls back to the canonical condition text when that parser does not recognize the condition. Pricing pages without log context continue to parse the stored expression for display.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
