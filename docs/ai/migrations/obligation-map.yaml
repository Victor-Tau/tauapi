      "gaps": []
    },
    {
      "id": "OBL-0238",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 61,
      "original_sha256": "c9d52d0c278addf630ebb1972f1279c4cbb916cba58425c2e89b44ab28fa11e3",
      "requirement": "The condition must reference at least one request probe (`param`, `header`, `hour`, `minute`, `weekday`, `month`, or `day`). Both branches must be numeric literals and the fallback must equal `1`. Other conditionals, including `(condition ? 2 : 1.5)`, are evaluated normally but are not traced. Integer-only factors use an integer-preserving trace callback, so instrumentation does not change expressions that require an integer operand (for example, `%`). The internal trace callback names are reserved and cannot be used in stored expressions.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0239",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 62,
      "original_sha256": "47cc445ebee526c146d25d082bdbde23f5b256f9b374b70ecd679c36a3157e1a",
      "requirement": "The compiled cache stores the canonical condition and multiplier for every instrumented node. Each run starts with the full detected rule list marked as unmatched; callbacks mark rules that actually evaluate true. Rules skipped by normal expression short-circuiting remain unmatched. This keeps the expression's numeric result unchanged and avoids reparsing it on each request.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0240",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 63,
      "original_sha256": "e2aa08bd92763dbb75e2a63605d4ac313ab0455115a67a9ef878aef74c986456",
      "requirement": "Settlement copies the actual run's traces into the consume log as:",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
