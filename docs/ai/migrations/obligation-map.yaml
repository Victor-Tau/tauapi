      "original_sha256": "c7ed851508852bfc4515cb7327263eb18cfd43538d4398dfa250ed04d1bdc0ab",
      "requirement": "### Authentication Security (OWASP Mandatory)",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
