      "original_sha256": "1e52d2af7e69a871a36b356006fdbbb914e5f8bbff450694919bf2f32fe592d7",
      "requirement": "- **Page text**: All user-facing copy MUST support i18n; translate it with `t()` from `useTranslation()`.\n- **Usage scenarios**\n  - **React components**: MUST use `const { t } = useTranslation()` so the component re-renders when the language changes.\n  - **Non-React contexts** (utility functions, constants, class methods): MAY use `import { t } from 'i18next'`. Such usage does not update automatically on language change; use it only where reactive updates are not required.\n  - Even if a parent component already uses `useTranslation()`, child components SHOULD still use it themselves to remain independent.\n- **Proper nouns**: Brands, products, and technical terms MAY remain in English (e.g. API, React, TypeScript). If an established translation exists, use the translation.\n- **Translation keys**: Use hierarchical, semantically clear key names such as `dashboard.overview.title`, and keep naming consistent.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
      "disposition": "superseded",
      "comparison": "Explicit construction request replaces obsolete topology/navigation and permits registered docs. Flat English i18n keys match inherited global rule and source.",
      "gaps": []
    },
    {
      "id": "OBL-0066",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 16,
      "original_sha256": "a189d80faf7d7c9e6d17ca15890b630eb49fd1e9a04efe86c2cb76a11d190e37",
      "requirement": "- **Enums and copy (i18n in constants)**\n  Each feature's `constants.ts` often contains \"enum/status + display copy\" or \"success/error messages\". Follow these conventions uniformly to avoid missing i18n or inconsistent usage:\n  - **Success/error/notice messages** (e.g. `SUCCESS_MESSAGES`, `ERROR_MESSAGES`): the constant value represents only an **i18n key** (the same literal as the English fallback). When displaying, you **MUST** go through `t()`, e.g. `toast.success(t(SUCCESS_MESSAGES.API_KEY_CREATED))`, `toast.error(t(ERROR_MESSAGES.UNEXPECTED))`. It is **forbidden** to use `toast.success(SUCCESS_MESSAGES.xxx)` directly as the final copy.\n  - **Labels of statuses/options**: in constants, use **labelKey** (a string, i.e. an i18n key) consistently, and render it in components with `t(config.labelKey)`; alternatively, by convention, use `label` to store a key string identical to the English text and render it with `t(config.label)`. Use only one approach within the same feature; do not mix them.\n  - **When adding such constants**: register the corresponding key in `src/i18n/static-keys.ts` (if the project uses it for extraction), or ensure the copy appears as a `t('...')` literal so it can be scanned, to avoid missing translations.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
