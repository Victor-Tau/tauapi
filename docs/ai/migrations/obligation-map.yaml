      "requirement": "- Use Rsbuild; see `rsbuild.config.ts` for configuration; scripts are as defined in `package.json` (e.g. `bun run dev`, `bun run build`, `bun check -b`, `bun run lint`, `bun run format`); for package management see [3.15 Dependency Management](#315-dependency-management).\n- For code splitting and lazy loading strategy see [3.4 Performance](#34-performance); use appropriate formats and compression for assets; use `.env` for environment variables with the `VITE_` prefix, and do not hard-code them in code.\n- **Before release**: run typecheck, lint, and format checks, complete the production build, and check the artifact size and environment variable configuration.",
