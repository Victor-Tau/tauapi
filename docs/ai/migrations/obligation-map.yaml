    {
      "id": "OBL-0078",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 28,
      "original_sha256": "a8dfb10d15741159f0c646b0963cf365ecd104009202899a675f659f99d546fe",
      "requirement": "- **React**: Use `useMemo` and `useCallback` judiciously to reduce unnecessary re-renders; avoid creating new objects/arrays on the render path; use `React.memo` where necessary.\n- **Code splitting**: Use `React.lazy` and dynamic `import` for on-demand loading to control first-screen and route bundle size.\n- **Assets**: Choose appropriate image formats and sizes; consider virtual scrolling for large lists (e.g. @tanstack/react-virtual) and lazy loading for large numbers of images.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
