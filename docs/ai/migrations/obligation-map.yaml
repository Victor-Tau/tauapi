    {
      "id": "OBL-0020",
      "old_source": "tauapi-be/AGENTS.md",
      "old_paragraph": 20,
      "original_sha256": "a87ccd35a0c4870e47f911257ae53245487eb238e820f7ef0103940bca9ac44f",
      "requirement": "**Modern Go conventions:** Apply these conventions to new or modified Go code, including tests and `relaykit/`, when they preserve behavior and improve readability. Use the Go version declared in the relevant module's `go.mod` as the compatibility baseline.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/engineering.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
