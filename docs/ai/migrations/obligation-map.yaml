    {
      "id": "OBL-0092",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 42,
      "original_sha256": "5224c6978759b13155a96c4ef7cb75b25f032728d2d2999259775fb2e3a6588f",
      "requirement": "- **Feature modules**: Place them in `src/features/<feature>/`, containing `components/`, `lib/`, `hooks/`, and, as needed, `api.ts`, `types.ts`, `constants.ts`, entry components, etc.\n- **Shared**: Put shared components in `src/components/` and shared utilities and types in `src/lib/`; component files use PascalCase, utility/type files use kebab-case or `types.ts`, and types are named in PascalCase and exported with `export type`.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
