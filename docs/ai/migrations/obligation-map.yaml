    },
    {
      "id": "OBL-0244",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 67,
      "original_sha256": "6ceae37f7061320a9d8141dfcf61d9a055f1e13335a244e28a8649f0304e016e",
      "requirement": "## Task Usage Expressions",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0245",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 68,
      "original_sha256": "7a77fe5bfb12b1badcc2da6933d22869797cf83c56a700b503b65c945af731b9",
      "requirement": "Task plugins can expose validated, provider-specific billing facts through\n`meta.usageSchema`. Expressions read those facts with `u(\"key\")`. A literal key\nmust be declared by the plugin schema before the expression can be saved. A\nsingle-plugin model's unchanged stored expression, and its unchanged provider\noverride, stay saveable after the plugin narrows the model's profile; any edit\nmust follow the current profile.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0246",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 69,
      "original_sha256": "6761557c4d35272fc157355e9a52224efc8daa2e7d0aa619bfcf5b767ddcf3c8",
      "requirement": "Multiple plugins may serve the same model with different usage schemas. The\nexecuting channel identifies the plugin; clients do not select a billing\nprovider. Task expression resolution uses this order:",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0247",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 70,
      "original_sha256": "11d5529e3a3b91c0dcc90b7e70f55d3f20493fdded25a98652e6fe4a730dc952",
      "requirement": "1. `billing_setting.plugin_billing_expr[\"<pluginKey>::<clientModel>\"]`\n2. The same plugin's override for the final mapped model, when present\n3. The client model's expression when its billing mode is `tiered_expr`\n4. The final mapped model's expression when the client model has no expression\n   billing mode",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0248",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 71,
      "original_sha256": "b087f76d3a02c372c9ba373bbc0ea50ca701cea43173e696778ea794178d7a4c",
      "requirement": "Plugin overrides always use task-usage semantics, independently of the model's\nbilling mode. The flat override map is a separate option and never contributes\ncomposite keys to model names or model-price synchronization exports. Existing\nprices are not rewritten. The billing snapshot freezes the selected expression;\ncompletion uses that snapshot even if provider pricing later changes.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0249",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 72,
      "original_sha256": "e54b62154c2241ee3ac369a8be1ed580b8c6371a7ed7a5bc93e54843a9c2cb7b",
      "requirement": "A model-level expression save smoke-tests each candidate's selected schema,\nskipping candidates with their own override in the same complete draft.\nProvider expression saves validate the plugin/model binding and that plugin's\nschema; errors identify both model and plugin. For a shared model, an effective\nexpression referencing an undeclared literal `u()` key is unconfigured for that\nprovider, including references in branches skipped by the current request.\nSubmission rejects it with 400 `model_price_error`; administration and public\npricing expose the unconfigured state. Public model-level metadata remains the\nfirst plugin's view in ascending key order, with provider variants added\nseparately.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0250",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 73,
      "original_sha256": "855d796807606134913e8fa030edb5ff61a96d4b0f2533af2a73675ee389c6a2",
      "requirement": "Saved provider overrides remain visible when only one provider remains.\nAdministration exposes unavailable plugin/model bindings as `stale` and permits\npreserving or removing their existing expressions. Changes to those expressions\nstill require a valid binding; writes compare against the locked database\nsnapshot rather than the process cache. No overrides are silently pruned.\nPublic provider variants include their effective `billing_mode` so inherited\nratio/per-call pricing is distinct from an unconfigured usage expression.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0251",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 74,
      "original_sha256": "3d1164230a5bf896a943294d481280e2c0ee66d12a7383b9aedcd5758ae9bcfa",
      "requirement": "Plugins serving different model families can optionally declare\n`meta.usageProfiles: [{models: [\"image-model\"], schema: {...}, examples: [...]}]`.\nEach profile provides the complete usage schema and optional display examples\nfor its declared models. It replaces, rather than merges with, the plugin's\ndefault `usageSchema` and `usageExamples`. A model may belong to only one\nprofile, and profile model names must use the spelling declared in `meta.models`.\nAn empty profile schema is allowed; a missing or null schema is not. Token-unit\nprofiles require their own examples, using the same validation as the defaults.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0252",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 75,
      "original_sha256": "71fc6758d000b2250f046c7acc6d5ece3aee17180713221d64abe8b5ae41008f",
      "requirement": "The host resolves model aliases before selecting usage metadata. Model-level\npricing and expression-save APIs use the declared target; an ambiguous alias\nwith multiple targets in the same plugin retains the plugin defaults. Usage\nvalidation uses the executing plugin and final upstream model. Polling\nselects metadata from each saved task's model, including in mixed-model batches.\nAn upstream name that no profile declares, such as a channel mapping to a vendor\nendpoint ID, falls back to the client-facing model's profile. Unmatched models\nand plugins without profiles retain the plugin defaults.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0253",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 76,
      "original_sha256": "2d566077d7380224712f62f4528e1adab31ca047f41f9572e9a7f4290f19837c",
      "requirement": "Profiles do not introduce a request-body whitelist or remove legacy multiplier\nextensions. Numeric hook facts retain a consistent floating-point representation\nfor expression evaluation, including fields outside the selected profile.\nSaving an expression checks literal usage keys against the selected schema;\nalready stored expressions are not migrated. Single-plugin submissions retain\nthe existing key-check behavior; shared models enforce the compatibility rule\nabove. Existing runtime error and quota safety checks still apply.\nCompletion continues to evaluate the frozen expression after overlaying measured\nfacts; no schema snapshot or database migration is introduced.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0254",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 77,
      "original_sha256": "f70819ed6e962907c4adbeb85b26279d2fb2129c860fcc6425991f7b732d29bc",
