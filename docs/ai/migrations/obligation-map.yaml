    {
      "id": "OBL-0096",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 46,
      "original_sha256": "60beb630ceb471cffa742c4aeb9ad3bd3ba6aabc38766965ac6214d8174cb312",
      "requirement": "- Validate authentication and permissions at the route and API layers; add secondary confirmation and similar safeguards for sensitive operations.\n- Validate data on both frontend and backend (e.g. Zod), and do not trust frontend-only validation; do not store sensitive information in frontend storage, use environment variables for configuration, and never hard-code secrets.\n- Rely on React's default escaping and use `dangerouslySetInnerHTML` with caution; for cross-origin requests and cookies use `withCredentials` and handle CSRF as the backend requires.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
