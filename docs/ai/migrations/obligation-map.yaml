    {
      "id": "OBL-0068",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 18,
      "original_sha256": "3480ee41f2f5fa8acb7526ae8093f0f6884a5ac7d967498e65500e508c9dba7b",
      "requirement": "- For plain and compact number display, you MUST reuse `formatNumber` / `formatCompactNumber` from `@/lib/format` first. For amounts, balances, and quotas, use the existing `@/lib/currency` or the corresponding business wrapper, preserving precision, units, and conversion semantics. Use `Intl.NumberFormat` directly only for format options the existing wrappers cannot express; do not change the displayed numeric precision just to unify the calling style.\n- `zhCN` / `zhTW` are the project's UI language codes, not valid BCP 47 tags. Any argument derived from the UI language, whether referenced directly, destructured, aliased through a variable, or passed through functions, MUST be converted with `toIntlLocale()` from `@/i18n/languages` before it enters `Intl.*`, `toLocaleString` / `toLocaleDateString` / `toLocaleTimeString`, or a shared formatting function. Do NOT write your own mapping for language codes such as `zhCN`; handling only Simplified Chinese would miss Traditional Chinese.\n- React components subscribe to the language via `useTranslation()` and compute `const locale = toIntlLocale(i18n.resolvedLanguage || i18n.language)` at render time, e.g. `formatNumber(value, locale)`. Do not freeze the current language in a module constant or initial state; the format MUST update after a language switch. Where the runtime default locale or a fixed protocol locale is explicitly intended, you MAY omit the locale, pass `undefined`, or use a valid fixed tag.\n- `bun run lint` / `bun run lint:fix` enable the **`project/intl-locale` error**, which checks raw `language` / `resolvedLanguage` in the calls above, local variable assignments and destructuring aliases, and invalid fixed tags. Do not bypass it with lint-disable. The static check does not track data flow across functions or modules, so callers must still follow the conversion convention.\n- When changing language conversion or number formatting, regression tests MUST cover `zhCN`, `zhTW`, the other five UI languages, and the fallback for invalid languages; when component language responsiveness is involved, they MUST also cover switching languages. When changing the lint rule, verify that violating code is reported and valid conversions produce no false positives; passing type checks and builds does not replace these verifications.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
