    {
      "id": "OBL-0266",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 89,
      "original_sha256": "549f52d829cdb39c9902a1b5c470abab8ffe1b5f98f164738391431586b31477",
      "requirement": "Before saving, the host compiles every expression, rejects literal `u()` keys\nthat the selected task plugin did not declare, and smoke-tests usage vectors.\nEvery numeric field is exercised at 0, 1, and its host-owned unit ceiling\n(`second` 3600, `count` 128, `token`/`credit` int32 max). Enum values are exercised as a\nCartesian product. Smoke vectors are capped at\n64, reducing oversized enum dimensions to their first and last values. Every\nevaluated result must be finite and non-negative.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
