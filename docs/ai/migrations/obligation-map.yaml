    {
      "id": "OBL-0012",
      "old_source": "tauapi-be/AGENTS.md",
      "old_paragraph": 12,
      "original_sha256": "78827e5a60bf5c994843c4ee004b3bed579ba40bd185b5871d20410df7c338d7",
      "requirement": "### Backend (`i18n/`)\n- Library: `nicksnyder/go-i18n/v2`\n- Languages: en, zh-CN, zh-TW\n- Scope: text with no web console in between (errors returned to AI clients, emails, notifications), translated with `i18n.T` / `i18n.Translate`\n- Web console API messages are English source text built with `common.NewMessage` / `common.ApiErrorT` / `common.ApiSuccessT`; the frontend translates them, so add each key to all seven frontend locale files\n- Stored log content is `[]*common.Message`; a fail reason written by the gateway is a fixed English sentence that is also a key in the frontend locale files\n- Server log lines are English text passed through `common.LogText`; `DEFAULT_LANGUAGE=zh-CN` prints the Chinese text of the lines that have one in `common/log_text.zh-CN.json`, and is the language of backend messages for a reader who states none",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/engineering.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
