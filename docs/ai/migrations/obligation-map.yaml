      "original_sha256": "ac00db90f17c93c398981627258cfdd6df2f1912b0923ae75ef1ca24f60bcba5",
      "requirement": "### Token Normalization via AST Introspection",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0296",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 119,
      "original_sha256": "02d9e74113e0a94464a231da2b3173525c7f24af27414dae3c8a0795694bcdd1",
      "requirement": "Different upstream APIs report `prompt_tokens` differently:\n- **OpenAI/GPT**: `prompt_tokens` = total (text + cache + image + audio)\n- **Claude**: `input_tokens` = text only (cache reported separately)",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0297",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 120,
      "original_sha256": "9dca070362a1a87406bd352c58d0a63ba99340bae5f243c589a0e16e504bdee1",
      "requirement": "The system normalizes `p` to mean \"tokens not separately priced\" by subtracting sub-categories **only when the expression references them**. This is determined by walking the compiled AST to find `IdentifierNode` references — zero runtime cost after first compilation (cached).",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0298",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 121,
      "original_sha256": "76fe09bdc3c2801d3462415d4f5437cc2a439eddb1c1b256cfc760dd1d1a6a7e",
      "requirement": "Example: `p * 2.5 + c * 15 + cr * 0.25`\n- Expression uses `cr` → cache read tokens subtracted from `p`\n- Expression doesn't use `img` → image tokens stay in `p`, priced at $2.50",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0299",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 122,
      "original_sha256": "69e0095412c323a7ce70251d5aba11d8ea5d881161de4b01362870d3bf9d856d",
      "requirement": "### `len` — Context Length Variable",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0300",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 123,
      "original_sha256": "ab1aa1041eb780c864003ccc6a19e3e1fd1344dae3a8950c4158969b629b15e9",
      "requirement": "`len` represents the total input context length, designed for **tier condition evaluation** (e.g. `len <= 200000 ? ...`). Unlike `p`, `len` is never reduced by sub-category exclusion.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0301",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 124,
      "original_sha256": "04dcf310c71a860cc5f756721fc9c6d24d65fa1a33bd2ef5544775d86b6713c6",
      "requirement": "**Computation rules:**\n- **Non-Claude (GPT/OpenAI format)**: `len = prompt_tokens` (the raw total from the upstream response)\n- **Claude format**: `len = input_tokens + cache_read_tokens + cache_creation_tokens` (since Claude's `input_tokens` is text-only, cache must be added back to reflect full context length)",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0302",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 125,
      "original_sha256": "25a0371946d93443fa3c96e482c5eee5d4ce9449fed9681ced31893f067795ae",
      "requirement": "This ensures that heavy cache usage doesn't cause the tier condition to incorrectly evaluate to a lower tier. For example, if a request has 300K total context but 250K is cached, `p` with cache subtracted would be only 50K (standard tier), while `len` correctly reports 300K (long-context tier).",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
