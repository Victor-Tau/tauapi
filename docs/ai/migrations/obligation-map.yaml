      "old_paragraph": 40,
      "original_sha256": "1eb835380e030e3021191cd2c183d98ee344cc60c1f232b7deacda9c1db7d35a",
      "requirement": "- Primarily use Tailwind utility classes, and merge dynamic class names with `cn()`; avoid inline styles in non-dynamic cases.\n- For responsiveness, use mobile-first and Tailwind breakpoints (`sm:`, `md:`, `lg:`, etc.); use CSS variables and `dark:` for theming and dark mode, centralize custom styles in `src/styles/`, and write as little custom CSS inside components as possible.",
