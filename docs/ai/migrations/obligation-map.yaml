      "requirement": "- Use **Bun**: `bun install`, `bun add <pkg>`, `bun add -d <pkg>`, `bun remove <pkg>`, `bun pm ls`, `bun update`, etc.\n- Before adding a dependency, evaluate its maintenance status, size, and license; keep production and development dependencies clearly separated, control versions with `^`/`~`, and update regularly to pick up security fixes.",
