      "old_paragraph": 36,
      "original_sha256": "bb4c99e93975a984f82f7d1792c661d7b9d319831355b8e70e44103573b35633",
      "requirement": "- Use TanStack Router; route files are located in `src/routes/` and defined with `createFileRoute`; validate search parameters with a Zod schema + `validateSearch`.\n- Perform authentication and redirects in `beforeLoad` to avoid unnecessary requests; for nested structures use layout routes and prefixes such as `_authenticated`, and render child routes via `<Outlet />`.\n- Navigate with `useNavigate` or `Link`, keeping type safety, and avoid manipulating `window.location` directly.",
