      "id": "OBL-0073",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 23,
      "original_sha256": "9cfad467e8e3ebf8f32c33ebcad89d699f9d8fe58c458adca774b3688c8ec700",
      "requirement": "- **Search before development**: Before adding or modifying UI, you MUST read the project `shadcn-ui` skill and use `rg --files` / `rg` to search `src/components/` and the relevant `src/features/`; when generic interactions are involved, also check `src/hooks/`. Search by purpose and behavior, not only by the name of the component you plan to add. Read the candidate component's implementation, props, and actual usage examples before settling on an approach.\n- **Reuse order**: Prefer project business wrappers that fit the scenario; if their capability is insufficient, first evaluate existing props, slots, composition, or a compatible extension. Only when business wrappers are truly unsuitable, compose from the existing base components in `src/components/ui/`. Only when a capability gap remains within the project, evaluate introducing a component or adding a new implementation; checking external registries does not replace searching within the project.\n- **Reuse down to the behavior layer**: Using only base components such as `Button`, `Dialog`, and `AlertDialog` does not mean the corresponding generic capabilities such as copy, confirmation, and dialog layout have been reused. When an existing business wrapper can cover the case, you MUST use that wrapper; it is forbidden to reassemble the same interaction, state, and styling inside a feature.\n- **Conditions for adding new**: Before adding a replacement implementation, you MUST state the specific capability the candidate component lacks, and record the candidate paths and the reasons they cannot be reused, composed, or compatibly extended in the change description or PR. Differences in copy, icons, size, color, or host page are not grounds for a duplicate implementation; handle those differences through existing APIs and theme conventions first.\n- **Reasonable composition**: New feature components that carry business data, permissions, events, and content are allowed, but the generic UI and interactions within them MUST still be reused. Extending a shared component MUST preserve existing call behavior; do not stuff unrelated business logic into it for a single page, and do not build an over-generalized abstraction just to remove a small amount of similar code.\n- **Base element boundary**: In business code, controls already covered by base components, such as buttons, inputs, selectors, and overlays, MUST use the project components; do not hand-write equivalent controls or bypass the wrappers to call the underlying library directly. Plain semantic layout, hidden fields, and special controls that existing components cannot express MAY use native elements; special controls must still state the capability gap and meet accessibility requirements.",
