      "original_sha256": "d1cec99eaab1bdd28f033de3754a53d540f4c540f51f0ac5b2d5fd6ff3ee9d85",
      "requirement": "- **Do not scatter tests for a small change:** For a focused feature or fix, extend an existing suitable test file first. If a new test file is necessary, add at most one and consolidate the key regression cases there. MUST NOT create separate test files for the same small feature across `controller/`, `service/`, `setting/`, or other layers merely because its call chain crosses those layers. Do not repeat fixtures and assertions at each layer. Keep the cases compact and focused on observable behavior; the number of production files touched is not a reason to add more test files.\n- Do not add tests that only improve coverage numbers, prove that code happens to run, or lock in implementation details without a user-visible or cross-module contract.\n- Avoid fake fuzz/stress/smoke/performance tests built from random inputs, large loop counts, sleeps, timing comparisons, or log-only assertions.\n- Avoid duplicate tests that exercise the same branch with different names but no new invariant.\n- Avoid tests that force incorrect provider/protocol semantics into production code.\n- Avoid tests that assert private constants, select-field lists, helper internals, or file layout when observable behavior is already covered elsewhere.\n- Prefer deterministic table tests with explicit inputs and exact expected outputs.\n- When tests need database, request context, user group, settings, or cache state, initialize that state explicitly inside the test fixture.\n- New or substantially rewritten Go backend tests MUST use `github.com/stretchr/testify/require` for setup and fatal assertions, and `github.com/stretchr/testify/assert` for non-fatal value checks.\n- Avoid hand-written assertion helpers unless they encode a reusable project-specific invariant.\n- When cleaning tests, preserve meaningful regression coverage. If a deleted test covered a real contract indirectly, replace it with a smaller test that asserts that contract directly.",
