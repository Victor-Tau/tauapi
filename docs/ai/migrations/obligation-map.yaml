    {
      "id": "OBL-0282",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 105,
      "original_sha256": "464ce321962e5c8f35ba88ed0daad58b8d345500b43fef6da230c49c9d787d0b",
      "requirement": "When a request arrives and the model uses `tiered_expr` billing:\n1. Loads expression from `billing_setting.GetBillingExpr()`\n2. Builds `RequestInput` (headers + body) for `param()` / `header()` functions\n3. Runs the expression with locally estimated input tokens (`P` and `Len`) and zero output tokens (`C=0`). Client output limits do not affect the reservation. If request token estimation is disabled, the estimated input is zero.\n4. Converts output to quota: `rawCost / 1,000,000 * QuotaPerUnit`. For token-priced leaves, multiplies this reservation by `quota_setting.pre_consume_multiplier` (default 1; any finite positive decimal). The multiplier does not change context-length tier selection, actual settlement, or request-priced leaves. The snapshot freezes the multiplier for image quantity retries; group retries reuse the multiplied reservation. Older snapshots with no multiplier retain a factor of 1.\n5. Creates `BillingSnapshot` and stores it on `RelayInfo`. Expression and request state stay frozen for settlement. An auto-group retry refreshes group-dependent fields from the selected group before the next upstream attempt. If a free initial group skipped pre-consume and the retry selects a paid group, the billing session is created before that attempt. If an existing session moves to a more expensive group, its reservation is raised to that group's estimate before sending; cheaper groups are refunded only after actual usage is settled.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
