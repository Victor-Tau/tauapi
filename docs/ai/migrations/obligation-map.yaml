    {
      "id": "OBL-0227",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 50,
      "original_sha256": "1dbcc4418f5d04ac41aec389993e10b6cbfd9821bd03ee870c555254bbe3671d",
      "requirement": "`tier(\"request\", fixed(0.01))` replaces all token charges in the selected leaf\nwith a $0.01 base price for one successful HTTP/SSE request. Other leaves may\nstill use token pricing. Group ratios and request multipliers continue to apply;\nexisting tool surcharges are calculated separately and added as before. A stream\ndoes not incur a fixed fee per chunk. Realtime and task usage expressions reject\n`fixed()` before upstream submission or reservation.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0228",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 51,
      "original_sha256": "c55a32c4542c7b7ec2b248ba6907c861662528ef59e9629b687047e6e5ffdd0d",
      "requirement": "The amount must be a finite, non-negative numeric literal whose v1 scaled value\nis finite. Explicit `fixed(0)` is valid and stays free. Expressions using `fixed`\nmust consist of a conditional pricing tree and the standard request multiplier\nfactors described below, with each leaf wrapped in `tier()`. Adding fixed and\ntoken charges in one leaf, adding multiple tiers together, or multiplying a\nfixed price by tokens is rejected. Validation examines the original AST,\nincluding branches that optimization or short-circuiting would skip. Existing\nexpressions without `fixed()` retain their original grammar and behavior.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0229",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 52,
      "original_sha256": "ad17559a4c1cde5bd9352da35517c031b2180629901f2b6ef69f538a6656d457",
      "requirement": "`fixed(amount)` returns `amount * 1,000,000` internally, preserving v1's existing\nquota conversion and rounding. Pre-consume matches conditions using estimates;\nsettlement reevaluates against actual or existing locally estimated usage and\nreconciles any change of branch through the normal billing session. Missing\nupstream usage retains the existing estimation path; an actual request-priced\nbranch can charge even with zero tokens. Failures retain the normal refund\npolicy. Settlement evaluation errors retain the reservation and its estimated\nbilling unit.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
      "id": "OBL-0230",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 53,
      "original_sha256": "c3fdb50172cf765e1f6e7e5217df224501d5e492ec48e49450a7c27b48f37470",
      "requirement": "Evaluation results expose `billing_unit` (`token` or `request`) and, for a\nrequest-priced leaf, `fixed_price` in USD before multipliers. Pre-consume snapshots\ncarry `estimated_billing_unit` and `estimated_fixed_price`; consume logs append\nthe actual values to `other`. An explicit zero price is present in these fields.\nOlder snapshots and logs need no migration. The expression remains the sole\npricing configuration.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
