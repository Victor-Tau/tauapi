      "original_sha256": "f9575ee62461f965161b4f7b6c591cd90018aac71fb53ff5fbfc527270d7039e",
      "requirement": "**Upstream image quantity settlement:** The billable image count may be lowered or raised from the upstream response only through `RelayInfo.UpdateImageCount` on the HTTP image relay, or through the `image_count` usage fact a task plugin returns on completion; a zero or out-of-range count leaves the reserved request quantity in place. Derive the count from image payloads, never from JSON structure:",
