    {
      "id": "OBL-0094",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 44,
      "original_sha256": "8b292a4040c31e2bbf4f13dc385b8a21c0fc9efa4d81a5c22339e96ab5418ab4",
      "requirement": "- Use semantic HTML (e.g. `header`, `nav`, `main`, `footer`), and associate inputs with `label` in forms.\n- Ensure keyboard operability and a sensible focus order; use ARIA where necessary (e.g. `aria-label`, `aria-expanded`, `aria-hidden`); add `aria-hidden=\"true\"` to decorative icons, and provide text equivalents for important information.\n- Contrast MUST meet WCAG 2.1 AA (at least 4.5:1 for body text).",
