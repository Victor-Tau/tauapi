    {
      "id": "OBL-0082",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 32,
      "original_sha256": "080141db0d60641ed177272265a5e7f8e918bb9b217d4e7b060756e3832a32c2",
      "requirement": "- **React Query**: Use `useQuery` for data fetching and `useMutation` for changes; configure a unique `queryKey` for every query (array form with a consistent hierarchy is recommended); call `invalidateQueries` for related queries in `onSuccess`, optionally combined with optimistic updates. Handle server errors uniformly through `handleServerError` (see [3.9 Error Handling](#39-error-handling)).\n- **Axios**: Use the project's shared `api` instance (including `baseURL`, `headers`, `withCredentials: true`); GET requests are deduplicated by default and special requests can disable this via configuration; authentication refresh and request retry are handled in interceptors; ordinary error notifications are the responsibility of the final failure callback of the Query/Mutation or of the direct caller.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
