      "old_paragraph": 22,
      "original_sha256": "f40667a12b2a9f0362c9da9b8f83cbd5654b08e33f0366b7acdb136d7127c967",
      "requirement": "**relaykit and tokenkit module independence:** The `relaykit/` and `tokenkit/` Go modules MUST remain independently buildable.",
