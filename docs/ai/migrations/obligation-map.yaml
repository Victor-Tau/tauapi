      "old_paragraph": 23,
      "original_sha256": "cfc5a6de41873f812844ded888e69f5bcaf590edcee0e8371d6a76e0522e90c5",
      "requirement": "- Code under `relaykit/` or `tokenkit/` MUST NOT import or depend on packages from the root `new-api` module, or rely on root-only configuration, generated files, or workspace wiring. `tokenkit/` also MUST NOT depend on `relaykit/`.\n- Any change affecting `relaykit/`, `tokenkit/`, or their public APIs MUST be verified with `GOWORK=off go build ./...` inside that module; a successful root-module build is not sufficient.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
