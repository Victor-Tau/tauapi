    {
      "id": "OBL-0081",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 31,
      "original_sha256": "4419f5b9b98527e2a1547dcd7b9bc5c099bec536b60cfd8ea3c8a20adc63d673",
      "requirement": "### 3.6 API Requests",
