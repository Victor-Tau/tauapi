      "old_paragraph": 2,
      "original_sha256": "2280f01d115523c1163a4665e8bf0ca708134d9ab0727cfcbd6f8520f871c03a",
      "requirement": "## Design Philosophy",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
