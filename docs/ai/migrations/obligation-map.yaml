      "requirement": "- Use function components and Hooks with a single responsibility; component props MUST have explicit types (interface or type alias).\n- **Props usage**: Do not destructure component props unless necessary; access properties via `props.xxx` to keep code clear (see [3.2 Code Style and Types](#32-code-style-and-types)).\n- When a single file exceeds about 200 lines, consider splitting out child components or extracting logic into custom Hooks; type definitions MAY live in the same file as the component or in the same module's `types`.",
