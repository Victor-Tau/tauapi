    {
      "id": "OBL-0010",
      "old_source": "tauapi-be/AGENTS.md",
      "old_paragraph": 10,
      "original_sha256": "cb5d69efd4f3b8e93a747086489a0790d49d4203bee7282b4ec881035ca650e1",
      "requirement": "- The Go gateway handles management APIs, upstream relay, billing, and background tasks across `router/`, `middleware/`, `controller/`, `service/`, `model/`, and `relay/`.\n- `relaykit/` is an independent Go module for protocol DTOs and conversions; transport, authentication, database access, and billing stay in the host.\n- `tokenkit/` is an independent Go module for text and image token counting and estimation; request parsing, file loading, and billing stay in the host.\n- JavaScript task plugins live in `plugins/tasks/`, run through `pkg/jsplugin/`, and integrate with host task polling and settlement.\n- `web/` is the React frontend (see `web/AGENTS.md`); `electron/` is the desktop wrapper.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/engineering.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
