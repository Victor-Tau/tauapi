    {
      "id": "OBL-0080",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 30,
      "original_sha256": "7dce1f9b763d5adeb2b8354a37346240753610bcb50738f5a786e528df4cca67",
      "requirement": "- Define stores with Zustand's `create`, and give state and actions clear types.\n- In components, prefer subscribing with selectors to avoid whole-store subscriptions that cause extra renders, e.g. `const user = useAuthStore((s) => s.auth.user)`.\n- For state that needs persistence, read/write localStorage inside the store and restore it at initialization.\n- Place stores by feature in `src/stores/`; keep each file's responsibility clear and names descriptive.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
