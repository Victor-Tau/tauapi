    {
      "id": "OBL-0095",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 45,
      "original_sha256": "4fd26b0ed78277af9d4b30ea4db5ba80541c8f7ff4c66b4c84f62a674f9e7eee",
      "requirement": "### 3.13 Security",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
