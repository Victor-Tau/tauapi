      "old_paragraph": 34,
      "original_sha256": "1c4ec06dfd57620becc567bb56a2eea351af6a449f3228ea88a1815a323d41ab",
      "requirement": "- Use React Hook Form + Zod: define the schema under the feature module's `lib/`, export the form type with `z.infer`, and use `useForm` with `@hookform/resolvers/zod` for validation.\n- Put submit logic in `onSubmit` and show loading and error states; after success, reset the form or close the dialog depending on the scenario. Map server validation errors to the corresponding fields and display them (see [3.9 Error Handling](#39-error-handling) for how to display field-level errors).",
