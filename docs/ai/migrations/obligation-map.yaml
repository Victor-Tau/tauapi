      "old_paragraph": 41,
      "original_sha256": "9776aa5d282851084e3a964cad1bc55f133c4003c4abcbd959c41babff52b70a",
      "requirement": "### 3.11 File Organization",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
