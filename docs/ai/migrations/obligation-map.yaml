    {
      "id": "OBL-0088",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 38,
      "original_sha256": "3ecc8f2c20313a18d7f9199622978f26eaaac7d84e3439d4ed4cb4cfc2cabd3c",
      "requirement": "- **Server errors**: Use `handleServerError(error, fallbackMessage?)` uniformly, and preferentially preserve the specific reason from the server. When the same failure propagates along `cause`, notify only once; different operations are notified separately even if the text is identical. It is forbidden to write a full Axios error object (which may contain credentials) directly to the console.\n- **Notification ownership**: The ordinary request interceptor does not show a Toast. Use the shared `createAppQueryClient` to notify when a Query/Mutation finally fails; a Mutation's custom `onError` is responsible for its own notification or form errors. Do not report errors during automatic retries or on deliberate cancellation. `meta.errorToast: false` disables the automatic notification, and the page can still call the error handling function explicitly.\n- **Business failures**: Preserve the original API response contract; a Query uses `requireServerSuccess` to check `success: false`, or the business layer throws with `createServerError(response, fallbackMessage?)` while preserving the source. Direct requests MUST explicitly handle failure responses and Promise rejections; a Mutation that needs to display a failure state MUST NOT treat a failed result as a successful save.\n- **Authentication compatibility**: Preserve the stable error code mapping and the safe messages of `AuthOperationError`; do not unwrap its source to display masked details. Maintain the existing constraints on refresh, redirect, and no replay of one-time authorization.\n- **Display**: Use a uniform approach such as `toast.error`; route-level errors are handled by `errorComponent`, providing a friendly error page and recording information useful for troubleshooting.\n- **Forms**: After validation and server errors are mapped to fields, display them below the field; use approaches consistent with the form library such as `form.setError`.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
      "disposition": "moved",
      "comparison": "Full original retained; English successor reviewed against paragraph obligations",
      "gaps": []
    },
    {
