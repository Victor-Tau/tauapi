      "requirement": "```json\n{\n  \"request_rules\": [\n    { \"cond\": \"param(\\\"service_tier\\\") == \\\"fast\\\"\", \"multiplier\": 2, \"matched\": true }\n  ]\n}\n```",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
