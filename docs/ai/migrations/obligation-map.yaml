      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 43,
      "original_sha256": "c08e17cb27e1bf280cd0de6a9677a687823453260d8f60e03e6fb6d1e5bc004b",
      "requirement": "### 3.12 Accessibility",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
