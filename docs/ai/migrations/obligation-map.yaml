      "id": "OBL-0070",
      "old_source": "tauapi-fe/AGENTS.md",
      "old_paragraph": 20,
      "original_sha256": "d539761082854ad7781874771038118f72775b3e12bc4badcef7ea2e571c5a2f",
      "requirement": "- **Expressions**: Nested ternary expressions of 2 or more levels are forbidden; use `if-else`, early returns, or extracted functions instead. A single-level ternary MAY be kept, but it must be concise.\n- **Readability**: Control function cyclomatic complexity and split complex logic into small functions; give variables and functions meaningful names that follow conventional rules such as camelCase.\n- **TypeScript**: Avoid `any`; prefer concrete types or `unknown`. Explicitly annotate parameter and return types. Use `import type { X } from '...'` for type-only imports.\n- **Type checking**: After every change to TypeScript or TSX code, run the type check (e.g. `bun check -b`). If type errors appear, you MUST fix them until there are none; do not leave any behind.\n- **Lint checking**: Before finishing any code change, you MUST run lint on the files involved and fix all lint errors in those files; do not leave any errors behind. Warnings MAY be handled according to the scope and risk of the change.\n- **Destructuring**: Do not destructure objects unless necessary, especially component props; using `props.xxx` directly is clearer and avoids adding needless code complexity.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-fe/docs/ai/engineering.md",
