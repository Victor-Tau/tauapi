      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 90,
      "original_sha256": "752bafb8b02d651f98e18af2eefd5026638a7352e10c7e559ce3b73b1b3773bd",
      "requirement": "Submission evaluates the expression with request-derived usage facts and\nfreezes both the expression and those facts in the billing snapshot. On\ncompletion, the host overlays completion facts on the frozen submission facts\nkey by key, so measured values replace estimates while facts omitted by the\ncompletion hook retain their submission values. The same expression is then\nevaluated again; a changed fact can therefore produce a settlement delta and a\ndifferent matched tier. Evaluation failure keeps the pre-consumed charge.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
      "disposition": "moved",
