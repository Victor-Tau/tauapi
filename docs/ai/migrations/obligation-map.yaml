    {
      "id": "OBL-0265",
      "old_source": "tauapi-be/pkg/billingexpr/expr.md",
      "old_paragraph": 88,
      "original_sha256": "b6e90b0134ef3f031cd7f0398c38dfd84cad8f56a76d4acdd49f3e6e37176b05",
      "requirement": "The tier body is an optional non-negative constant plus one or more\n`u(\"<number field>\") * <unit price>` terms. Token-unit fields use the\ncanonical scaled shape `u(\"<field>\") * <dollars per 1M tokens> / 1000000`.\nCredit, second, and count fields keep the bare `u(\"<field>\") * <unit price>`\nshape. Tier conditions are equality checks\nbetween declared enum fields and values, optionally joined by `&&`, with\nchained ternaries following the same ordering rules as token tiers. Numeric\nrange tiers are not part of the current canonical shape. Request rules after\n`|||` remain orthogonal and use the same syntax as token expressions.",
      "applicability": "same behavior surface as original; obsolete topology is superseded",
      "destination": "tauapi-be/docs/ai/billing-expression.md",
